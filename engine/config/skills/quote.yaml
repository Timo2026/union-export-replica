name: quote
category: manufacturing
description: 基于材料/数量/表面处理/公差计算 CNC 加工报价（含精度/五轴/线切割附加费）
timeout: 120
executor: src.runtime.quote_adapter
schema:
  type: object
  required: [material, quantity]
  properties:
    material:
      type: string
      description: 材料牌号
    quantity:
      type: integer
      minimum: 1
      description: 数量
    surface_treatment:
      type: string
      description: 表面处理
    tolerance:
      type: string
      description: 公差等级
