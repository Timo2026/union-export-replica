# rectangular_quote workflow
- step: 1
  skill: parse_rfq
  args:
    email_text: "$request"
- step: 2
  skill: check_dfm
  args:
    rfq: "$rfq"
- step: 3
  skill: fleet_coordinator
  args:
    material: "6061"
    shape: "block"
    dimensions: "$dimensions"
    quantity: 1
- step: 4
  skill: verify_gate
  args:
    ctx_dict: "$ctx"
- step: 5
  skill: write_reply
  args:
    use_llm: false
