<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Union Manufacturing Export Agent · v6.1.0 融合版 (真接线)</title>
  <link rel="stylesheet" href="css/workbench.css" />
  <style>
    /* v6.1.0 minimal styles (项目品牌色 #76B900, fallback) */
    :root{--bg:#0b1020;--card:#151b2e;--line:#2a3352;--tx:#e6ebff;--mut:#8b96b8;--acc:#76B900;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--lock:#b45309}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    header h1{margin:0;font-size:16px}
    header .sub{color:var(--mut);font-size:12px;margin-left:auto}
    .pill{padding:3px 10px;border-radius:999px;font-size:11px;border:1px solid var(--line);background:var(--card)}
    .pill.on{color:var(--ok);border-color:var(--ok)}
    .pill.warn{color:var(--warn);border-color:var(--warn)}
    .pill.err{color:var(--err);border-color:var(--err)}
    .pill.lock{color:var(--lock);border-color:var(--lock);background:rgba(180,83,9,.12)}
    .shell{display:grid;grid-template-columns:320px 1fr 380px;height:calc(100vh - 56px);gap:0}
    .col{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
    .col:last-child{border-right:0}
    .col-hd{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
    .col-bd{flex:1;overflow-y:auto;padding:10px 14px;font-size:13px}
    .item{padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:var(--card);cursor:pointer;font-size:12px}
    .item:hover{border-color:var(--acc)}
    .item.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset;background:rgba(118,185,0,.08)}
    .item .from{font-weight:600;font-size:12px}
    .item .subj{color:var(--mut);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .item .badges{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
    .badge{font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--mut)}
    .badge.pass{color:var(--ok);border-color:var(--ok)}
    .badge.hitl{color:var(--warn);border-color:var(--warn)}
    .badge.blocked{color:var(--err);border-color:var(--err)}
    .section{margin-bottom:10px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:6px}
    .section h3{margin:0 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
    .section pre{background:var(--bg);padding:8px;border-radius:4px;font-size:11px;overflow:auto;max-height:200px;margin:0}
    .golden-chain{display:flex;gap:4px;padding:6px 14px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
    .gc-step{padding:3px 8px;font-size:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--mut);font-family:Consolas,monospace;white-space:nowrap}
    .gc-step.done{color:var(--ok);border-color:var(--ok);background:rgba(34,197,94,.1)}
    .gc-step.active{color:var(--warn);border-color:var(--warn);background:rgba(245,158,11,.1)}
    .toast{position:fixed;top:10px;right:10px;padding:8px 14px;background:var(--card);border:1px solid var(--acc);border-radius:4px;font-size:12px;color:var(--acc);z-index:99;display:none}
    .toast.show{display:block}
    .err{color:var(--err);font-size:11px;padding:4px 8px;background:rgba(239,68,68,.1);border-radius:4px;margin-top:4px}
    .loading{color:var(--mut);font-size:11px;padding:6px 0}
  </style>
</head>
<body>
  <header>
    <h1>🏭 Union Manufacturing Export Agent</h1>
    <span class="sub">v6.1.0 融合版 · 25 Skill (20 独立 + 5 委托) · L3 邮件自动驱动</span>
    <span class="pill" id="enginePill">⏳</span>
    <span class="pill" id="apiPill">⏳</span>
    <span class="pill lock">🔒 iron-rule-1 LOCKED</span>
  </header>

  <div class="golden-chain" id="goldenChain">
    <span class="gc-step">INTAKE</span><span class="gc-step">PARSE</span><span class="gc-step">DFM</span><span class="gc-step">QUOTE</span><span class="gc-step">VERIFY</span><span class="gc-step">REPLY</span><span class="gc-step">CRM</span>
  </div>

  <main class="shell">
    <!-- LEFT: Inbox -->
    <section class="col">
      <div class="col-hd">📬 Inbox <span class="pill" id="inboxCount">0</span></div>
      <div class="col-bd" id="inboxList">
        <div class="loading">📡 拉取 /v1/mail/inbox ...</div>
      </div>
    </section>

    <!-- MIDDLE: Inspector -->
    <section class="col">
      <div class="col-hd">🔍 Inspector <span class="pill" id="inspSub">—</span></div>
      <div class="col-bd" id="inspector">
        <div class="section"><h3>选一封邮件开始</h3><div class="loading">↑ 从 Inbox 选邮件</div></div>
      </div>
    </section>

    <!-- RIGHT: Agent -->
    <section class="col">
      <div class="col-hd">🤖 Agent <span class="pill" id="sessionTag">session ✓</span></div>
      <div class="col-bd" id="chat">
        <div id="chatThread"></div>
        <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--line)">
          <textarea id="chatTa" placeholder="输入指令: 算报价 / 跑门禁 / 起草回复 (Enter 发送)" style="width:100%;min-height:50px;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--tx);padding:6px 8px;font-family:inherit;font-size:12px"></textarea>
          <div style="margin-top:6px;display:flex;gap:6px">
            <button onclick="send()" style="padding:4px 12px;background:var(--acc);color:#000;border:0;border-radius:4px;cursor:pointer;font-size:11px">▶ 发送</button>
            <span id="cacheStat" class="pill" style="font-size:10px">💾 cache 0/100</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    /* v6.1.0 融合版 · 真接线 5 endpoints · 不依赖 webui/index.html */
    const $ = (s) => document.querySelector(s);
    const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); };
    const esc = (s) => String(s||"").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    async function jget(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(url + " → " + r.status);
      return r.json();
    }
    async function jpost(url, body) {
      const r = await fetch(url, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {}) });
      if (!r.ok) throw new Error(url + " → " + r.status);
      return r.json();
    }

    /* 1. 拉 /health, 标状态 */
    async function loadHealth() {
      try {
        const h = await jget("/health");
        $("enginePill").textContent = h.engine || "engine ?";
        $("enginePill").className = "pill " + (h.engine && h.engine.includes("live") ? "on" : "warn");
        $("apiPill").textContent = h.status === "ok" ? "API ✓" : "API ✗";
        $("apiPill").className = "pill " + (h.status === "ok" ? "on" : "err");
        addChat("sys", `v6.1.0 已就绪 · ${h.engine} · ${h.multimodal}`);
      } catch (e) {
        $("apiPill").textContent = "API ✗";
        $("apiPill").className = "pill err";
        addChat("err", "/health 失败: " + e.message);
      }
    }

    /* 2. 拉 /v1/mail/inbox, 渲染列表 */
    async function loadInbox() {
      const box = $("inboxList");
      try {
        const d = await jget("/v1/mail/inbox?limit=20");
        const items = d.items || [];
        $("inboxCount").textContent = items.length;
        if (!items.length) { box.innerHTML = '<div class="loading">📭 空收件箱</div>'; return; }
        box.innerHTML = items.map(it => {
          const cls = it.badges?.includes("BLOCKED") ? "blocked" : it.badges?.includes("HITL") ? "hitl" : it.badges?.includes("PASS") ? "pass" : "";
          return `<div class="item" data-mid="${esc(it.mail_id)}" onclick="openMail('${esc(it.mail_id)}')">
            <div class="from">${esc((it.from||"").split("<")[0].trim())}</div>
            <div class="subj">${esc(it.subject || "")}</div>
            <div class="badges">${(it.badges||[]).map(b => `<span class="badge ${cls}">${esc(b)}</span>`).join("")}</div>
          </div>`;
        }).join("");
      } catch (e) {
        box.innerHTML = '<div class="err">/v1/mail/inbox 失败: ' + esc(e.message) + '</div>';
      }
    }

    /* 3. 打开邮件 → 拉 8 区 + Chat bind */
    let currentMail = null;
    async function openMail(mailId) {
      currentMail = mailId;
      document.querySelectorAll(".item").forEach(el => el.classList.toggle("sel", el.dataset.mid === mailId));
      $("inspSub").textContent = mailId;
      $("inspector").innerHTML = '<div class="loading">📡 拉 8 区上下文 ...</div>';
      try {
        const [cust, geo, rag, pending, verif, postm, comm, hitl] = await Promise.all([
          jget(`/v1/mail/${encodeURIComponent(mailId)}/context/customer`),
          jget(`/v1/mail/${encodeURIComponent(mailId)}/context/geometry`),
          jget(`/v1/mail/${encodeURIComponent(mailId)}/context/rag`),
          jget(`/v1/mail/${encodeURIComponent(mailId)}/context/pending`),
          jget(`/v1/mail/${encodeURIComponent(mailId)}/context/verification`),
          jget(`/v1/mail/${encodeURIComponent(mailId)}/context/postmortem`),
          jget(`/v1/mail/${encodeURIComponent(mailId)}/context/commercial`),
          jget(`/v1/mail/${encodeURIComponent(mailId)}/context/hitl`).catch(() => null),
        ]);
        renderInspector({ customer: cust, geometry: geo, rag_hits: rag.hits || [], verification: verif, postmortem: postm, commercial: comm, hitl });
        addChat("sys", `📧 已加载 ${mailId.slice(0, 16)} · 8 区聚合完成 · ${verif.status || "?"}`);
      } catch (e) {
        $("inspector").innerHTML = '<div class="err">拉 8 区失败: ' + esc(e.message) + '</div>';
      }
    }

    function renderInspector(d) {
      const v = d.verification || {};
      const c = d.customer || {};
      const g = d.geometry || {};
      const r = d.rag_hits || [];
      const cm = d.commercial || {};
      const vCls = v.status === "PASS" ? "pass" : v.status === "HITL" ? "hitl" : v.status === "BLOCKED" ? "blocked" : "";
      $("inspector").innerHTML = `
        <div class="section"><h3>🛡 门禁 <span class="badge ${vCls}">${esc(v.status||"?")}</span></h3>
          <div>风险分: <b>${v.risk_score ?? "?"}</b> · 升级原因: ${(v.reasons||[]).map(esc).join("; ") || "无"}</div>
        </div>
        <div class="section"><h3>👤 客户 <span class="badge">${c.is_new ? "新客" : "老客"}</span></h3>
          <div>${esc(c.name||"-")} · ${esc(c.customer_id||"")}</div>
          <div style="margin-top:4px">${(c.signals||[]).map(s => `<div>· ${esc(s.type)}: ${esc(s.detail)}</div>`).join("")}</div>
        </div>
        <div class="section"><h3>📐 几何</h3>
          <div>bbox: ${g.bbox ? g.bbox.join("×") + " mm" : "—"} · 体积: ${g.volume_cm3 ?? "—"} cm³ · 质量: ${g.weight_kg ?? "—"} kg</div>
        </div>
        <div class="section"><h3>💰 报价</h3>
          <div>${cm.ok ? `${cm.currency||"CNY"} ${cm.unit_price} × qty = <b>${cm.final_price||cm.total_price}</b>` : "未报价"}</div>
        </div>
        <div class="section"><h3>🔍 RAG (${r.length} 条)</h3>
          <div>${r.slice(0,3).map(h => `<div>· <code>${esc(h.case_id||"")}</code> · ${esc(h.title||h.snippet||"")}</div>`).join("") || "—"}</div>
        </div>
        ${d.hitl && d.hitl.draft ? `<div class="section"><h3>📝 草稿</h3><pre>${esc(d.hitl.draft.body||"")}</pre></div>` : ""}
      `;
    }

    /* 4. Chat */
    function addChat(role, text) {
      const t = $("chatThread");
      const div = document.createElement("div");
      const isUser = role === "user";
      const isErr = role === "err";
      div.className = isErr ? "err" : (isUser ? "item sel" : "item");
      div.style.marginBottom = "4px";
      div.style.fontSize = "12px";
      div.innerHTML = `<b>${isUser ? "你" : isErr ? "✗" : "🤖"}</b> ${esc(text)}`;
      t.appendChild(div);
      t.scrollTop = t.scrollHeight;
    }
    async function send() {
      const ta = $("chatTa");
      const text = ta.value.trim();
      if (!text) return;
      ta.value = "";
      addChat("user", text);
      // 简化: 调 /v1/cache/stats 探活 + 调 chat skill 路径 (mock fallback)
      try {
        const c = await jget("/v1/cache/stats");
        $("cacheStat").textContent = `💾 cache ${c.size}/${c.max_size} · hit ${(c.hit_rate*100).toFixed(0)}%`;
        addChat("sys", `Cache: ${c.hits} hit / ${c.misses} miss · 命中率 ${(c.hit_rate*100).toFixed(0)}%`);
      } catch (e) { /* ignore */ }
      // mock 模拟 agent 回复
      const t = text.toLowerCase();
      if (t.includes("报价") || t.includes("quote")) addChat("sys", "已触发 calc_quote (deterministic 铁律①) · 详见 Inspector 报价区");
      else if (t.includes("门禁") || t.includes("verify")) addChat("sys", "已触发 verify_gate · " + ($("inspSub").textContent || "—"));
      else if (t.includes("起草") || t.includes("draft")) addChat("sys", "已触发 write_reply (draft_only 铁律③)");
      else if (t.includes("历史") || t.includes("客户")) addChat("sys", "已触发 crm_memory + rag_recall · 见 Inspector 客户/RAG 区");
      else if (t.includes("批准") || t.includes("approve")) addChat("sys", "已触发 approve_gate (HITL 必走 + 铁律②)");
      else addChat("sys", "可试: 算报价 / 跑门禁 / 查客户 / 起草回复 / 批准");
    }
    $("chatTa").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

    /* 5. 启动 */
    loadHealth().then(loadInbox);
  </script>
</body>
</html>
