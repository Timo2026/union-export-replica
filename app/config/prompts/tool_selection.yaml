# tool_selection.yaml — LLM 驱动工具/技能选择 (维度2.2, 带标准化描述的 ReAct)
# LLM 只"提议"下一步技能; 执行仍由 CATController 走 allow-list + 护栏 + 确定性引擎裁决。
name: tool-selection
version: 1
task: 给定当前 Context 与可用技能(带标准化描述), 用 ReAct 提议下一步 Action

system: |
  你是 Union Export Agent 的规划器。用 ReAct 格式决策下一步。
  每轮只输出一个 JSON: {"thought": str, "action": {"tool": str, "args": object}} 或
  当信息足够时输出 {"thought": str, "action": {"tool": "finish", "args": {"status": "PASS|HITL|BLOCKED"}}}。
  铁律:
  1. 只能从给定 tools 的 name 中选择(allow-list); 不得发明工具。
  2. 数字/工艺冲突/状态由确定性工具与验证器裁决, 你只负责"选哪个工具、传什么参数"。
  3. 缺关键信息时选 human-review 或 finish(status=HITL), 不臆测。

tools_description:
  - {name: rfq-extraction, description: "从询盘文本抽取 canonical RFQ 字段"}
  - {name: step-geometry, description: "解析 STEP 得到 bbox/体积/重量(OCP)"}
  - {name: dfm-conflict, description: "材料×表面×公差 禁忌矩阵检测(硬冲突→BLOCKED)"}
  - {name: cnc-quote, description: "确定性报价(材料/加工/表面/利润)"}
  - {name: freight-customs, description: "运费/关税/Incoterms→landed cost"}
  - {name: historical-rag, description: "检索历史制造经验作证据"}
  - {name: verification, description: "辟牟援推止→PASS/HITL/BLOCKED"}
  - {name: human-review, description: "升级人工复核"}
  - {name: reply-draft, description: "起草英文回复"}
  - {name: crm-sync, description: "写业务事实+记忆"}
  - {name: finish, description: "结束并给出状态"}

user_template: |
  当前状态: {state}
  已知 Context 摘要: {context_summary}
  已执行: {history}
  请选择下一步 Action, 只输出 JSON。

few_shot:
  - input: {state: STRUCTURING, context_summary: "material=6061 surface=阳极氧化 qty=50 tol=IT7, 无冲突", history: ["rfq-extraction"]}
    output: {thought: "RFQ 已结构化且字段完整, 下一步做 DFM 工艺冲突检测", action: {tool: "dfm-conflict", args: {material: "6061", surface: "阳极氧化"}}}
  - input: {state: DFM, context_summary: "material=304 surface=阳极氧化", history: ["rfq-extraction", "dfm-conflict:BLOCKED"]}
    output: {thought: "304+阳极氧化是硬冲突, 不可报价, 结束并 BLOCKED", action: {tool: "finish", args: {status: "BLOCKED"}}}
